[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mapper"
description = "The SNES cartridge memory map and transfer engine, measured against thousands of real cartridges."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["snes", "lorom", "hirom", "memory-map", "dma", "cartridge", "conformance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/gufranco/snes-mapper-python"
Source = "https://github.com/gufranco/snes-mapper-python"
Issues = "https://github.com/gufranco/snes-mapper-python/issues"

[tool.setuptools]
packages = ["mapper"]

[tool.setuptools.dynamic]
version = { attr = "mapper.version.VERSION" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"mapper/environment.py" = ["BLE001", "T201"]
"*.test.py" = ["PLR2004", "N999"]
"conformance/*.py" = ["T201"]
"mapper/doctor.py" = ["BLE001", "T201"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["mapper", "conformance"]
exclude = "^cartridges/"

[tool.coverage.run]
source = ["."]
branch = true
omit = []

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  'if __name__ == "__main__":',
  'if TYPE_CHECKING:',
  '^\s*\.\.\.$',
  ': \.\.\.$',
]
