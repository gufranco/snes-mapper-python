[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mapper"
description = "The SNES cartridge memory map and transfer engine, measured against thousands of real cartridges."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["snes", "lorom", "hirom", "memory-map", "dma", "cartridge", "conformance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/gufranco/snes-mapper-python"
Source = "https://github.com/gufranco/snes-mapper-python"
Issues = "https://github.com/gufranco/snes-mapper-python/issues"

[tool.setuptools]
packages = ["mapper"]

[tool.setuptools.dynamic]
version = { attr = "mapper.version.VERSION" }

[tool.setuptools.exclude-package-data]
mapper = ["*.test.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  # N818 wants every exception to end in Error. The control flow signals here are
  # named the way CPython names its own: StopIteration, SystemExit and
  # GeneratorExit carry no suffix either. The exceptions that report a genuine
  # failure do end in Error.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# A test file sits beside the module it covers and is named after it, so its
# module name carries a dot that N999 rejects. The layout is deliberate: a
# module and its tests are read together.
"*.test.py" = ["PLR2004", "N999"]
# These are command line tools. Printing is their output, not a stray debug
# statement left behind, and routing it through a logger would put a level and
# a timestamp in front of a report meant to be read by a person.
"conformance/*.py" = ["T201"]
# The doctor catches everything on purpose. It exists to report what this
# machine did when something went wrong, and a refusal it did not anticipate is
# the finding rather than a reason to stop with a traceback. Printing is its
# output for the same reason as above.
"mapper/doctor.py" = ["BLE001", "T201"]

[tool.mypy]
# Every flag mypy has, plus the ones strict does not turn on. This is address
# arithmetic from end to end, so the errors that matter are the ones where a bank,
# an offset or a None crosses a boundary it should not.
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["mapper", "conformance"]
exclude = "^cartridges/"

[tool.coverage.run]
source = ["mapper", "conformance"]
branch = true
omit = []

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  # The command line guard hands argv to a function that is itself tested, so
  # there is nothing behind it left to exercise. Importing the module to cover
  # the guard would run the tool rather than test it.
  'if __name__ == "__main__":',
  # A type checking block never runs, by definition. Python 3.14 drops it before
  # coverage can see it and earlier versions do not, so leaving it in would make
  # the gate mean one thing on the newest runtime and another on the oldest
  # supported one, which is worse than either.
  'if TYPE_CHECKING:',
  # A protocol method has no body to run, whether the ellipsis sits on its own
  # line or after the signature. The same version split applies.
  '^\s*\.\.\.$',
  ': \.\.\.$',
]
