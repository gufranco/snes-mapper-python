---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every file Prettier reads is formatted
        run: pnpm run format:check

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      - name: Lint every YAML file
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker and the build backend's stubs
        run: |
          pipx install mypy==1.14.1
          pipx inject mypy types-setuptools==84.0.0.20260812

      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage and the build backend its tests drive
        run: |
          python -m pip install --disable-pip-version-check \
            coverage==7.6.10 setuptools==84.0.0

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find mapper conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

      - name: Every quoted sentence, against the document it came from, where it is present
        run: python -m conformance.quotes

  speed:
    name: Throughput
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The map must still answer faster than the floor
        run: python -m conformance.speed

  conformance:
    name: Corpus
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Replay every header combination the corpus recorded
        run: python -m conformance.corpus

  cartridges:
    name: Cartridges
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read every cartridge present
        run: |
          status=0
          python -m conformance.against_cartridges || status="$?"
          if [ "${status}" -eq 2 ]; then
            notice="No cartridge is present on a hosted runner,"
            notice="${notice} so this sweep was skipped rather than passed."
            notice="${notice} It reads the header of every retail cartridge in the library"
            notice="${notice} and holds each one to the recorded corpus."
            notice="${notice} Run it locally with a library you own,"
            notice="${notice} or point SNES_CARTRIDGE_DIR at one."
            echo "::notice title=Cartridges::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: Map every test cartridge present
        run: |
          status=0
          python -m conformance.testcarts || status="$?"
          if [ "${status}" -eq 2 ]; then
            notice="No test cartridge is present on a hosted runner,"
            notice="${notice} so the test cartridges were not mapped."
            notice="${notice} Point SNES_TEST_CARTRIDGE_DIR at a folder holding them."
            echo "::notice title=Test cartridges::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

  package:
    name: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Every module ships and no test does
        run: python -m conformance.package dist/mapper-*.whl
